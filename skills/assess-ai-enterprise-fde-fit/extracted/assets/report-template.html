<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI企服与FDE适配度报告</title>
  <style>
    :root{--ink:#17231f;--muted:#66736e;--paper:#f4f2ec;--card:#fffdf8;--line:#dcd8ce;--pine:#17483c;--mint:#8cc7ad;--lime:#d9e89a;--amber:#f0b65a;--violet:#7c72b4;--shadow:0 18px 50px rgba(23,35,31,.09);--r:24px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;overflow-x:hidden;background:radial-gradient(circle at 82% 2%,#e6efd5 0,transparent 28%),var(--paper);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;line-height:1.65}.page{max-width:1180px;margin:auto;padding:28px 22px 70px}.topline{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:center;margin-bottom:18px;font-size:12px;letter-spacing:.08em;color:var(--muted)}.brand{font-weight:800;color:var(--pine)}.hero{position:relative;overflow:hidden;background:var(--pine);color:#f9fff9;border-radius:32px;padding:52px;box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;width:380px;height:380px;border-radius:50%;right:-130px;top:-190px;border:70px solid rgba(217,232,154,.16)}.kicker{display:inline-flex;padding:7px 12px;border:1px solid rgba(255,255,255,.25);border-radius:99px;font-size:12px;letter-spacing:.12em}.hero h1{font-family:Georgia,"Songti SC",serif;font-size:clamp(38px,6vw,74px);line-height:1.02;margin:24px 0 18px;max-width:780px}.hero p{max-width:760px;font-size:17px;color:#dce9e3;margin:0}.identity{margin-top:34px;display:flex;gap:12px;flex-wrap:wrap}.identity span{padding:7px 11px;background:rgba(255,255,255,.09);border-radius:9px;font-size:12px}.section{margin-top:44px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:17px}.section h2{font-family:Georgia,"Songti SC",serif;font-size:30px;margin:0}.section-no{font-size:12px;letter-spacing:.15em;color:var(--muted)}.score-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.score-card,.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 30px rgba(23,35,31,.05)}.score-card{padding:24px;min-height:210px;display:flex;flex-direction:column;justify-content:space-between}.score-label{font-size:13px;color:var(--muted)}.score-number{font-family:Georgia,serif;font-size:62px;line-height:1}.score-number small{font:14px system-ui;color:var(--muted)}.meter{height:7px;background:#e6e5df;border-radius:9px;overflow:hidden}.meter i{display:block;height:100%;border-radius:9px;background:var(--color,var(--pine));width:0}.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{padding:25px}.card h3{margin:0 0 14px;font-size:18px}.radar-wrap{display:grid;grid-template-columns:210px 1fr;gap:20px;align-items:center}.radar{width:210px;height:210px}.legend-row{margin:10px 0}.legend-row b{display:flex;justify-content:space-between;font-size:13px}.bar{height:7px;background:#e8e6df;border-radius:9px;margin-top:6px;overflow:hidden}.bar i{height:100%;display:block;background:var(--pine);border-radius:9px}.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.feature{padding:22px;border-top:5px solid var(--mint)}.pill{display:inline-flex;padding:4px 8px;border-radius:8px;background:#e8f2ed;color:var(--pine);font-weight:800;font-size:11px}.feature h3{margin:13px 0 7px}.feature p{margin:0;color:var(--muted);font-size:14px}.match-list{display:grid;gap:11px}.match{display:grid;grid-template-columns:72px minmax(160px,1fr) 2fr;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}.match:last-child{border:0}.match-score{font-family:Georgia,serif;font-size:34px;color:var(--pine)}.match h3,.match p{margin:0}.match p{font-size:13px;color:var(--muted)}.offer{background:#f8edcf;border-color:#ead6a3}.offer-name{font-family:Georgia,"Songti SC",serif;font-size:32px;line-height:1.2}.tag-list{display:flex;flex-wrap:wrap;gap:8px}.tag{background:rgba(255,255,255,.58);border:1px solid rgba(23,35,31,.13);padding:7px 10px;border-radius:10px;font-size:13px}.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.week{position:relative;padding:22px;background:var(--card);border:1px solid var(--line);border-radius:18px}.week:before{content:"";position:absolute;left:22px;top:0;width:50px;height:4px;background:var(--amber)}.week h3{margin:7px 0}.week ul,.list{padding-left:18px;margin:8px 0}.week li,.list li{margin:6px 0}.positioning{padding:36px;background:var(--ink);color:white;border-radius:28px;font-family:Georgia,"Songti SC",serif;font-size:clamp(24px,3.4vw,40px);line-height:1.45}.foot{margin-top:42px;padding-top:20px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.print{position:fixed;right:22px;bottom:22px;border:0;border-radius:99px;padding:13px 18px;background:var(--pine);color:white;box-shadow:var(--shadow);cursor:pointer}.empty{color:var(--muted);font-style:italic}
    .diagnosis{display:grid;grid-template-columns:260px 1fr;gap:28px;background:linear-gradient(135deg,#fffdf8,#edf3e2)}.diagnosis-meta{padding-right:24px;border-right:1px solid var(--line)}.diagnosis-meta strong{display:block;font:700 25px Georgia,"Songti SC",serif;margin:6px 0 18px}.prose{font-size:16px;line-height:1.95}.prose p{margin:0 0 1em}.prose p:last-child{margin-bottom:0}.callout{margin-top:16px;padding:15px 17px;background:#fff8e9;border-left:4px solid var(--amber);border-radius:0 12px 12px 0}.analysis-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.analysis-card{display:flex;flex-direction:column;gap:12px}.analysis-card .score-chip{font:700 30px Georgia,serif;color:var(--pine)}.analysis-card p{color:#485651;margin:0;line-height:1.8}.next-level{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);font-size:13px}.route-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.route-card{position:relative;overflow:hidden}.route-card:before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--violet)}.route-card h3{font-family:Georgia,"Songti SC",serif;font-size:25px}.route-fit{float:right;font:700 12px system-ui;padding:5px 9px;border-radius:99px;background:#eeeaf8;color:#554d88}.capability-list{display:grid;gap:12px}.capability{display:grid;grid-template-columns:170px 1fr 1fr;gap:18px;padding:22px;background:var(--card);border:1px solid var(--line);border-radius:18px}.capability h3{font-family:Georgia,"Songti SC",serif;margin:0 0 8px;font-size:22px}.capability p{margin:0 0 8px;color:#4f5c57}.capability .status{font-size:12px;color:var(--pine);font-weight:800}.teach-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.teach-card{background:#edf3e2}.teach-card h3{font-size:19px}.teach-step{font-size:13px;color:var(--muted);margin-top:12px;padding-top:12px;border-top:1px solid rgba(23,35,31,.13)}.final-advice{background:#e6efe9;border-color:#cadbd2}.final-advice p{font-size:17px;line-height:2;margin:0}.subtle{color:var(--muted);font-size:13px}.mini-title{font-size:12px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
    @media(max-width:900px){.score-grid,.feature-grid,.timeline,.analysis-grid,.teach-grid{grid-template-columns:repeat(2,1fr)}.grid-2,.diagnosis{grid-template-columns:1fr}.diagnosis-meta{padding-right:0;padding-bottom:18px;border-right:0;border-bottom:1px solid var(--line)}.hero{padding:36px}.match{grid-template-columns:62px 1fr}.match>div:last-child{grid-column:2}.capability{grid-template-columns:150px 1fr}.capability>div:last-child{grid-column:2}.route-grid{grid-template-columns:1fr}}
    @media(max-width:580px){.page{padding:14px 12px 50px}.hero{padding:28px 22px;border-radius:24px}.score-grid,.feature-grid,.timeline,.analysis-grid,.teach-grid{grid-template-columns:1fr}.radar-wrap{grid-template-columns:1fr}.radar{margin:auto}.topline{align-items:flex-start}.section{margin-top:34px}.print{right:12px;bottom:12px}.score-card{min-height:175px}.capability{grid-template-columns:1fr}.capability>div:last-child{grid-column:auto}.prose{font-size:15px}}
    @media print{body{background:white}.page{max-width:none;padding:0}.print{display:none}.hero,.card,.score-card,.week,.positioning{box-shadow:none;break-inside:avoid}.section{break-inside:avoid}.hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
  </style>
</head>
<body>
<main class="page" id="app"></main>
<button class="print" onclick="window.print()">打印 / 存为PDF</button>
<script>const DATA=__REPORT_DATA__;</script>
<script>
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const arr=v=>Array.isArray(v)?v:[]; const score=v=>Math.max(0,Math.min(100,Number(v)||0));
const level=v=>v>=85?'高度适配':v>=70?'较适配':v>=55?'条件适配':v>=40?'待补强':'探索期';
const list=(items,field='')=>items.length?`<ul class="list">${items.map(x=>`<li>${esc(field?x[field]:x)}</li>`).join('')}</ul>`:'<p class="empty">待补充</p>';
function radar(items,color){const n=Math.max(items.length,3),cx=100,cy=100,R=74,pt=(i,r)=>[cx+Math.cos(-Math.PI/2+i*2*Math.PI/n)*r,cy+Math.sin(-Math.PI/2+i*2*Math.PI/n)*r],poly=r=>Array.from({length:n},(_,i)=>pt(i,r).join(',')).join(' '),shape=items.map((x,i)=>pt(i,R*score(x.score)/100).join(',')).join(' ');return `<svg class="radar" viewBox="0 0 200 200" role="img" aria-label="维度雷达图">${[.25,.5,.75,1].map(r=>`<polygon points="${poly(R*r)}" fill="none" stroke="#d8d8d0"/>`).join('')}${Array.from({length:n},(_,i)=>`<line x1="100" y1="100" x2="${pt(i,R)[0]}" y2="${pt(i,R)[1]}" stroke="#ddd9ce"/>`).join('')}<polygon points="${shape}" fill="${color}33" stroke="${color}" stroke-width="3"/></svg>`}
function dimensionCard(title,items,color){return `<article class="card"><h3>${esc(title)}</h3><div class="radar-wrap">${radar(items,color)}<div>${items.map(x=>`<div class="legend-row"><b><span>${esc(x.name)}</span><span>${score(x.score)}</span></b><div class="bar"><i style="width:${score(x.score)}%;background:${color}"></i></div></div>`).join('')}</div></div></article>`}
function scoreCard(label,value,color,custom){return `<article class="score-card" style="--color:${color}"><div class="score-label">${esc(label)}</div><div class="score-number">${score(value)}<small> / 100</small></div><div><div class="meter"><i style="width:${score(value)}%"></i></div><div class="score-label" style="margin-top:8px">${custom||level(score(value))}</div></div></article>`}
function features(items,gap=false){return arr(items).map((x,i)=>`<article class="card feature" style="border-top-color:${gap?'#f0b65a':['#8cc7ad','#7c72b4','#d9e89a'][i%3]}">${x.evidence?`<span class="pill">${esc(x.evidence)}</span>`:''}<h3>${esc(x.title)}</h3><p>${esc(x.detail)}</p>${x.action?`<p style="margin-top:9px;color:#17231f"><b>补强：</b>${esc(x.action)}</p>`:''}</article>`).join('')||'<p class="empty">待补充</p>'}
const paras=v=>String(v||'').split(/\n+/).filter(Boolean).map(x=>`<p>${esc(x)}</p>`).join('')||'<p class="empty">待补充</p>';
const analysisCard=(key,label,value,color)=>{const x=(DATA.score_analysis||{})[key]||{};return `<article class="card analysis-card"><div><span class="score-chip" style="color:${color}">${score(value)}</span><span class="subtle"> / 100 · ${esc(label)}</span></div><div class="prose">${paras(x.analysis)}</div><div><div class="mini-title">主要依据</div>${list(arr(x.evidence))}</div><div class="next-level"><b>进入下一档：</b>${esc(x.next_level)}</div></article>`};
const s=DATA.scores||{},d=DATA.dimensions||{},o=DATA.offer||{},c=DATA.channels||{},pc=DATA.primary_customer||{},diag=DATA.diagnosis||{};
document.title=`${DATA.person_name}｜AI企服与FDE适配度报告`;
$('#app').innerHTML=`
<div class="topline"><span class="brand">乐阳老师 · AI ENTERPRISE SERVICE LAB</span><span>v2.2 · YY-AIES-2026-002</span></div>
<header class="hero"><span class="kicker">AI企服 × FDE × 商业化成熟度</span><h1>${esc(DATA.person_name)}的<br>方向适配报告</h1><p>${esc(DATA.summary)}</p><div class="identity"><span>生成日期 ${esc(DATA.generated_at||'未注明')}</span><span>置信度 ${score(s.confidence)}%</span><span>先看能力证据，再谈服务生意</span></div></header>
<section class="section"><div class="section-head"><div><div class="section-no">01 / SCOREBOARD</div><h2>不是贴标签，是看现在能不能下场</h2></div></div><div class="score-grid">${scoreCard('AI企业服务适配度',s.ai_service,'#17483c')}${scoreCard('FDE适配度',s.fde,'#7c72b4')}${scoreCard('商业化成熟度',s.commercial,'#f0b65a',s.commercial>=80?'可复制增长':s.commercial>=60?'可稳定销售':s.commercial>=40?'可小范围试卖':s.commercial>=20?'先做样板案例':'学习探索')}${scoreCard('评分置信度',s.confidence,'#8cc7ad',s.confidence>=80?'高置信度':s.confidence>=60?'中置信度':'低置信度')}</div></section>
<section class="section"><div class="section-head"><div><div class="section-no">02 / DIAGNOSIS</div><h2>先把结论讲透</h2></div></div><article class="card diagnosis"><div class="diagnosis-meta"><div class="mini-title">CURRENT STAGE</div><strong>${esc(diag.current_stage)}</strong><div class="mini-title">RECOMMENDED ROUTE</div><strong>${esc(diag.recommended_route)}</strong>${list(arr(diag.why))}</div><div><div class="prose">${paras(diag.analysis)}</div><div class="callout"><b>现阶段不要急着做：</b>${esc(arr(diag.not_now).join('；'))}</div></div></article></section>
<section class="section"><div class="section-head"><div><div class="section-no">03 / SCORE INTERPRETATION</div><h2>这些分数到底意味着什么</h2></div></div><div class="analysis-grid">${analysisCard('ai_service','AI企服',s.ai_service,'#17483c')}${analysisCard('fde','FDE',s.fde,'#7c72b4')}${analysisCard('commercial','商业化',s.commercial,'#c17b20')}</div></section>
<section class="section"><div class="section-head"><div><div class="section-no">04 / DIMENSIONS</div><h2>能力结构</h2></div></div><div class="grid-2">${dimensionCard('AI企服六维',arr(d.ai_service),'#17483c')}${dimensionCard('FDE六维',arr(d.fde),'#7c72b4')}</div></section>
<section class="section"><div class="section-head"><div><div class="section-no">05 / ROUTE CHOICE</div><h2>AI企服和FDE，应该怎么选</h2></div></div><div class="route-grid">${arr(DATA.route_comparison).map(x=>`<article class="card route-card"><span class="route-fit">${esc(x.fit)}</span><h3>${esc(x.route)}</h3><p><b>为什么：</b>${esc(x.why)}</p><p><b>进入方式：</b>${esc(x.entry)}</p><div class="callout"><b>暂时避免：</b>${esc(x.avoid)}</div></article>`).join('')||'<p class="empty">待补充</p>'}</div></section>
<section class="section"><div class="section-head"><div><div class="section-no">06 / CAPABILITIES</div><h2>你的能力如何变成客户价值</h2></div></div><div class="capability-list">${arr(DATA.capability_analysis).map(x=>`<article class="capability"><div><div class="status">${esc(x.level)}</div><h3>${esc(x.name)}</h3><p>${esc(x.meaning)}</p></div><div><div class="mini-title">客户为什么付费</div><p>${esc(x.customer_value)}</p><div class="mini-title">目前证据</div><p>${esc(x.evidence)}</p></div><div><div class="mini-title">主要短板</div><p>${esc(x.shortfall)}</p><div class="mini-title">下一份证明</div><p><b>${esc(x.next_proof)}</b></p></div></article>`).join('')||features(DATA.strengths)}</div></section>
<section class="section"><div class="section-head"><div><div class="section-no">07 / MARKET FIT</div><h2>你更适合服务谁</h2></div></div><article class="card"><div class="match-list">${arr(DATA.customer_matches).map(x=>`<div class="match"><div class="match-score">${score(x.score)}</div><div><h3>${esc(x.name)}</h3><p>决策人：${esc(x.decision_maker)}</p><p><b>为什么匹配：</b>${esc(x.why_fit)}</p></div><div><p><b>问题：</b>${esc(x.problem)}</p><p><b>不解决的损失：</b>${esc(x.loss)}</p><p><b>适合服务：</b>${esc(x.service)}</p><p><b>切入动作：</b>${esc(x.entry)}</p></div></div>`).join('')||'<p class="empty">待补充</p>'}</div></article><div class="grid-2" style="margin-top:18px"><article class="card"><h3>首要客群</h3><p>${esc(pc.profile)}</p>${list(arr(pc.reasons))}</article><article class="card"><h3>现阶段暂缓</h3><p>${esc(pc.defer)}</p></article></div></section>
<section class="section"><div class="section-head"><div><div class="section-no">08 / MINIMUM SELLABLE OFFER</div><h2>首发最小可售产品</h2></div></div><article class="card offer"><div class="offer-name">${esc(o.name)}</div><p><b>${esc(o.value)}</b></p><p>${esc(o.why_this)}</p><div class="grid-2"><div><h3>交付内容</h3><div class="tag-list">${arr(o.deliverables).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div><h3>交付步骤</h3>${list(arr(o.process))}<h3>验收标准</h3>${list(arr(o.acceptance))}</div><div><p><b>周期：</b>${esc(o.duration)}</p><p><b>测试价格：</b>${esc(o.price)}</p><p><b>报价逻辑：</b>${esc(o.pricing_logic)}</p><h3>客户需要配合</h3>${list(arr(o.client_inputs))}<p><b>不包含：</b>${esc(arr(o.exclusions).join('、'))}</p><p><b>升级产品：</b>${esc(o.upgrade)}</p></div></div></article></section>
<section class="section"><div class="section-head"><div><div class="section-no">09 / GO TO MARKET</div><h2>只打两条获客通道</h2></div></div><div class="grid-2"><article class="card"><h3>主要渠道 · ${esc(c.primary)}</h3><p>${esc(c.reason)}</p></article><article class="card"><h3>辅助渠道 · ${esc(c.secondary)}</h3><p><b>暂不使用：</b>${esc(c.avoid)}</p></article></div><div class="timeline" style="margin-top:18px">${arr(DATA.four_week_plan).map(x=>`<article class="week"><h3>${esc(x.week)}</h3>${list(arr(x.actions))}<p><b>${esc(x.targets)}</b></p></article>`).join('')}</div></section>
<section class="section"><div class="section-head"><div><div class="section-no">10 / RISKS & LEARNING</div><h2>短板不是结论，是学习任务</h2></div></div><div class="feature-grid">${features(DATA.gaps,true)}</div><div class="teach-grid" style="margin-top:18px">${arr(DATA.learning_plan).map(x=>`<article class="card teach-card"><div class="mini-title">LEARNING TASK</div><h3>${esc(x.topic)}</h3><p><b>为什么学：</b>${esc(x.why)}</p><div class="teach-step"><b>真实练习：</b>${esc(x.practice)}<br><b>学会的证明：</b>${esc(x.proof)}</div></article>`).join('')||'<p class="empty">待补充</p>'}</div></section>
<section class="section"><div class="section-head"><div><div class="section-no">11 / 90 DAYS</div><h2>90天路线</h2></div></div><div class="feature-grid">${arr(DATA.ninety_day_plan).map(x=>`<article class="card feature"><span class="pill">${esc(x.phase)}</span><h3>${esc(x.goal)}</h3>${list(arr(x.actions))}</article>`).join('')}</div></section>
<section class="section"><div class="section-head"><div><div class="section-no">12 / POSITIONING</div><h2>一句话业务定位</h2></div></div><div class="positioning">${esc(DATA.positioning)}</div><article class="card final-advice" style="margin-top:18px"><h3>给你的最终建议</h3><div class="prose">${paras(DATA.final_advice)}</div></article></section>
<section class="section"><article class="card"><h3>方法与置信度说明</h3><p>${esc(DATA.method_note)}</p></article></section>
<footer class="foot">本报告由乐阳老师设计的AI企服与FDE定位机器人协助生成。作者：乐阳老师｜版本：v2.2｜识别码：YY-AIES-2026-002。© 乐阳老师 All Rights Reserved。未经许可不可用于商业销售、付费培训、提示词合集或智能体产品；个人学习和非商业交流须保留作者、版本及识别码。AI分析仅作为业务定位与能力发展参考，最终方向应通过客户访谈、真实成交和实际交付持续验证；本测评不构成心理、职业资格或招聘结论。</footer>`;
</script>
</body>
</html>
